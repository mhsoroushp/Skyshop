version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    labels:
      - dependencies-nuget
      - security-nuget

    commit-message:
      prefix: "deps-nuget" 

  
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    labels:
      - dependencies-npm
      - security-npm

    commit-message:
      prefix: "deps-npm" 

    